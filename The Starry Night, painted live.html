<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Starry Night, painted live</title>
<style>
:root{--bg:#ece6d6;--ink:#2b3150;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07091a;--ink:#c9d3f0}}
:root[data-theme="dark"]{--bg:#07091a;--ink:#c9d3f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif}
#stage{position:relative;cursor:pointer;box-shadow:0 18px 50px rgba(0,0,0,.4)}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
p{margin:.8rem 12px 0;font-size:.9rem;line-height:1.5;text-align:center;opacity:.85}
</style>
</head>
<body>
<div id="stage"><canvas id="paint"></canvas><canvas id="glow"></canvas></div>
<p>“The Starry Night” after Vincent van Gogh (1889), painted live in your browser. Click to repaint.</p>
<script>
const W=1200,H=940,TAU=Math.PI*2;
const stage=document.getElementById('stage'),pc=document.getElementById('paint'),gc=document.getElementById('glow');
const c=pc.getContext('2d'),g=gc.getContext('2d');
let jobs=[],done=0,starsEnd=0,gateTs=0,last=0,seed=1,raf=0;
const rnd=()=>(seed=seed*16807%2147483647,(seed-1)/2147483646);
const R=(a,b)=>a+(b-a)*rnd(),pick=a=>a[Math.floor(rnd()*a.length)],cl=(v,a,b)=>Math.max(a,Math.min(b,v));

function fit(){
  const k=Math.min((innerWidth-24)/W,(innerHeight-100)/H),cw=Math.floor(W*k),ch=Math.floor(H*k);
  stage.style.width=cw+'px';stage.style.height=ch+'px';
  const dpr=Math.min(devicePixelRatio||1,2),S=cw*dpr/W;
  for(const cv of [pc,gc]){cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);}
  c.setTransform(S,0,0,S,0,0);g.setTransform(S,0,0,S,0,0);c.lineCap='round';c.lineJoin='round';
}
function brush(x,y,ang,len,w,col,al){
  c.strokeStyle=col;c.globalAlpha=al;c.lineWidth=w;c.beginPath();c.moveTo(x,y);
  const n=Math.max(2,Math.round(len/5));
  for(let i=0;i<n;i++){const a=typeof ang==='function'?ang(x,y):ang;x+=Math.cos(a)*5;y+=Math.sin(a)*5;c.lineTo(x,y);}
  c.stroke();c.globalAlpha=1;
}
/* ---- sky ---- */
const VORT=[[.47*W,.32*H,215,2.5],[.61*W,.31*H,130,-2.2],[.75*W,.27*H,100,1.8],[.33*W,.33*H,90,-1.4]];
function skyAng(x,y){
  const b=.15*Math.sin(x/170)+.12*Math.sin(y/90);let vx=.7*Math.cos(b),vy=.7*Math.sin(b);
  for(const [px,py,r,s] of VORT){const dx=x-px,dy=y-py,d=Math.hypot(dx,dy)+.001,w=s*Math.exp(-d*d/(r*r*1.6));vx+=-dy/d*w;vy+=dx/d*w;}
  return Math.atan2(vy,vx);
}
const SKY=['#0f1b4d','#18297a','#22388f','#2f4fb0','#3f6ac8','#5f8fd8','#86b0e6','#b9d3ef'];
function skyCol(x,y){
  const n=.5+.5*Math.sin(x*.013+Math.sin(y*.021)*2.2);
  let t=.38*n+.5*Math.pow(cl(y/(.68*H),0,1),1.1)+(rnd()-.5)*.4;
  for(const [px,py,r] of VORT)t+=.22*Math.exp(-((x-px)**2+(y-py)**2)/(r*r*2));
  const q=rnd();if(q<.05)return'#3a8a98';if(q<.075)return'#d8dca8';
  return SKY[cl(Math.floor(t*8),0,7)];
}
/* ---- stars and moon ---- */
const STARS=[[.31,.12,.95],[.47,.085,.8],[.61,.19,1.05],[.73,.3,.9],[.24,.44,.8],[.54,.47,.85],[.66,.06,.7],[.9,.4,.75]];
const MOON=[.865*W,.14*H];
function halo(x,y,s,rings){
  for(const [r0,col,w] of rings){
    const r=r0*s,n=Math.round(TAU*r/9);
    for(let i=0;i<n;i++){
      const a=i/n*TAU+R(-.05,.05),L=9/r*R(.8,1.5);
      c.strokeStyle=col;c.lineWidth=w*R(.8,1.3);c.globalAlpha=.9;
      c.beginPath();c.arc(x,y,r+R(-1.5,1.5),a,a+L);c.stroke();
    }
  }
  c.globalAlpha=1;
}
function paintStar(sx,sy,s){
  const x=sx*W,y=sy*H;
  halo(x,y,s,[[36,'#4f82cf',4.5],[29,'#8fbbea',4.5],[22,'#e6e6a6',4],[15,'#f5d84a',4.5],[9,'#fff3a8',5]]);
  c.fillStyle='#fff8c4';c.beginPath();c.arc(x,y,6*s,0,TAU);c.fill();
}
function paintMoon(){
  const [x,y]=MOON;
  halo(x,y,1,[[86,'#5f8fd6',5],[74,'#9fc3ea',5],[63,'#e8d878',5],[53,'#f5c64a',5]]);
  c.save();c.beginPath();c.arc(x,y,38,0,TAU);c.arc(x+16,y-4,33,0,TAU,true);c.clip();
  c.fillStyle='#f2b835';c.fillRect(x-45,y-45,90,90);
  for(let i=0;i<170;i++)brush(R(x-42,x+42),R(y-42,y+42),R(-1.2,1.2)+1.6,R(10,26),R(3,5),pick(['#f7d35a','#e89a2a','#fbe58a','#f2b835']),.9);
  c.restore();
}
/* ---- hills, village, cypress ---- */
const ridge=x=>H*(.665+.035*Math.sin(x*.0045+1.2)+.022*Math.sin(x*.0125+.4));
function paintHillBase(){
  c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=10)c.lineTo(x,ridge(x));c.lineTo(W,H);c.closePath();c.fillStyle='#2b3f7a';c.fill();
}
function hillStroke(){
  const x=R(-10,W+10),r=ridge(x),y=R(r-4,H),slope=Math.atan2(ridge(x+8)-r,8),dark=y>.8*H;
  brush(x,y,slope+R(-.35,.35),R(25,60),R(4,7.5),
    dark?pick(['#121a3a','#1a2748','#1f3a4a','#243c55']):pick(['#2a3f7a','#3a4f93','#4b6aa8','#2f4a55','#3d6a6a','#6b7fb5']),.9);
}
function daub(x,y,w,h,cols,n,len,wd){
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
  for(let i=0;i<n;i++)brush(R(x-6,x+w+6),R(y-6,y+h+6),R(-.3,.3),R(len*.6,len*1.2),wd,pick(cols),.95);
  c.restore();
}
function paintHouse(x,base,w,h,spire){
  const y=base-h;
  daub(x,y,w,h,['#c9a45c','#8a6a3a','#6a8aa0','#9aa07a','#4a5a7a'],Math.round(w*h/30),14,4);
  const rh=spire?h*1.1:h*.45;
  c.save();c.beginPath();c.moveTo(x-4,y);c.lineTo(x+w/2,y-rh);c.lineTo(x+w+4,y);c.closePath();c.clip();
  for(let i=0;i<Math.round(w*rh/22);i++)brush(R(x-6,x+w+6),R(y-rh,y),R(-.4,.4),R(8,16),4,pick(['#1f2a4a','#3a2f4a','#5a3b3b','#2b3550']),.95);
  c.restore();
  const nw=spire?3:1+Math.floor(rnd()*2);
  for(let i=0;i<nw;i++)if(rnd()<.85){c.fillStyle=pick(['#ffd95a','#ffe27a','#f5c542']);c.fillRect(x+R(4,w-10),y+R(6,h-14),5,8);}
}
function paintCypressBase(){
  c.beginPath();
  for(let t=0;t<=1;t+=.02)c.lineTo(cyx(t)-cyw(t),cyy(t));
  for(let t=1;t>=0;t-=.02)c.lineTo(cyx(t)+cyw(t),cyy(t));
  c.closePath();c.fillStyle='#0a1610';c.fill();
}
const cyx=t=>.165*W+34*Math.sin(t*3.1)-10*t+12*Math.sin(t*17);
const cyy=t=>H+10-t*(H+10-.09*H);
const cyw=t=>130*Math.pow(1-t,.8)*(.8+.2*Math.sin(t*12))+4;
function cypressStroke(){
  const t=rnd(),u=R(-1,1),x=cyx(t)+u*cyw(t),y=cyy(t),edge=Math.abs(u)>.7;
  const hi=!edge&&rnd()<.2;
  brush(x,y,(xx,yy)=>-Math.PI/2+.55*Math.sin(yy*.05+u*2.5)+u*.3,R(40,90),R(5,10),
    hi?pick(['#3a5a2a','#4d6a2b','#6b6a2f']):pick(['#05080a','#0a1710','#13281b','#1f3a22','#2c4a25']),.92);
}
/* ---- build and run ---- */
function build(){
  seed=1;jobs=[];done=0;starsEnd=0;gateTs=0;
  c.globalAlpha=1;c.fillStyle='#14246a';c.fillRect(0,0,W,H);g.clearRect(0,0,W,H);
  for(let i=0;i<9000;i++)jobs.push(()=>{const x=R(-20,W+20),y=R(-20,.72*H);brush(x,y,skyAng,R(30,80),R(4,8.5),skyCol(x,y),.88);});
  for(const [sx,sy,s] of STARS)jobs.push(()=>paintStar(sx,sy,s));
  jobs.push(paintMoon);starsEnd=jobs.length;
  jobs.push(paintHillBase);
  for(let i=0;i<4200;i++)jobs.push(hillStroke);
  for(let x=380;x<1060;x+=R(46,64)){const sp=Math.abs(x-790)<30;jobs.push(()=>paintHouse(x,.885*H+R(-6,8),sp?30:R(34,56),sp?72:R(26,44),sp));}
  jobs.push(paintCypressBase);
  for(let i=0;i<3800;i++)jobs.push(cypressStroke);
}
function twinkle(ts){
  g.clearRect(0,0,W,H);if(done<starsEnd)return;
  if(!gateTs)gateTs=ts;
  const f=cl((ts-gateTs)/1500,0,1);
  g.globalCompositeOperation='lighter';
  const blob=(x,y,r,a,rgb)=>{const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(${rgb},${a*2})`);gr.addColorStop(.35,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);
    g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);};
  STARS.forEach(([sx,sy,s],i)=>blob(sx*W,sy*H,52*s,f*(.16+.12*Math.sin(ts/700+i*1.9)),'255,240,170'));
  blob(MOON[0],MOON[1],110,f*(.12+.06*Math.sin(ts/900)),'255,200,90');
  g.globalCompositeOperation='source-over';
}
function tick(ts){
  const dt=Math.min(50,ts-(last||ts));last=ts;
  if(done<jobs.length){const n=Math.ceil(jobs.length*dt/9000);for(let i=0;i<n&&done<jobs.length;i++)jobs[done++]();}
  twinkle(ts);raf=requestAnimationFrame(tick);
}
function start(){cancelAnimationFrame(raf);fit();build();last=0;raf=requestAnimationFrame(tick);}
stage.addEventListener('click',start);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(start,250);});
start();
</script>
</body>
</html>
